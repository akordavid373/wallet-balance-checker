<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" rx="8"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="800" height="40" fill="#f1f5f9"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#eab308"/>
  <circle cx="56" cy="20" r="6" fill="#22c55e"/>
  <rect x="80" y="12" width="160" height="16" rx="4" fill="#e2e8f0"/>
  <rect x="620" y="12" width="80" height="16" rx="4" fill="#e2e8f0"/>
  <!-- header -->
  <rect x="24" y="60" width="752" height="48" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="90" font-size="18" font-weight="bold" fill="#0f172a">Wallet Dashboard</text>
  <text x="40" y="108" font-size="13" fill="#64748b">2 accounts · Account 1 selected</text>
  <rect x="620" y="70" width="70" height="28" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="632" y="89" font-size="13" fill="#374151">↻ Refresh</text>
  <rect x="700" y="70" width="70" height="28" rx="6" fill="white" stroke="#fecaca" stroke-width="1"/>
  <text x="712" y="89" font-size="13" fill="#dc2626">Disconnect</text>
  <!-- hero card -->
  <rect x="24" y="120" width="752" height="140" rx="12" fill="url(#hero)"/>
  <rect x="40" y="138" width="60" height="22" rx="999" fill="rgba(255,255,255,0.2)"/>
  <circle cx="50" cy="149" r="4" fill="#86efac"/>
  <text x="60" y="152" font-size="11" fill="#bfdbfe">Testnet</text>
  <text x="40" y="180" font-size="32" font-weight="bold" fill="white">1,234.5678 <tspan font-size="16" fill="#bfdbfe">XLM</tspan></text>
  <text x="40" y="210" font-size="13" fill="#bfdbfe" font-family="monospace">GABCDEF1234…WXYZ5678</text>
  <rect x="180" y="202" width="22" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="620" y="150" width="90" height="32" rx="8" fill="white"/>
  <text x="632" y="170" font-size="13" font-weight="500" fill="#1d4ed8">Send XLM</text>
  <!-- accounts list -->
  <rect x="24" y="276" width="752" height="180" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="300" font-size="16" font-weight="600" fill="#0f172a">Accounts</text>
  <!-- account 1 - selected -->
  <rect x="40" y="316" width="726" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="52" y="328" width="16" height="16" rx="8" fill="#3b82f6"/>
  <text x="56" y="339" font-size="10" fill="white" text-anchor="middle">W</text>
  <text x="76" y="339" font-size="14" font-weight="500" fill="#0f172a">Account 1</text>
  <text x="76" y="362" font-size="11" fill="#64748b" font-family="monospace">GABCDEF12…WXYZ5678</text>
  <text x="500" y="355" font-size="18" font-weight="bold" fill="#0f172a">1,234.5678 <tspan font-size="13" fill="#64748b">XLM</tspan></text>
  <rect x="730" y="335" width="20" height="20" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="735" y="350" font-size="14" fill="#3b82f6">✓</text>
  <!-- account 2 -->
  <rect x="40" y="384" width="726" height="56" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="52" y="396" width="16" height="16" rx="8" fill="#94a3b8"/>
  <text x="56" y="407" font-size="10" fill="white" text-anchor="middle">W</text>
  <text x="76" y="407" font-size="14" font-weight="500" fill="#0f172a">Account 2</text>
  <text x="76" y="428" font-size="11" fill="#64748b" font-family="monospace">G98XYZ56…ABCD1234</text>
  <text x="500" y="423" font-size="18" font-weight="bold" fill="#0f172a">56.7890 <tspan font-size="13" fill="#64748b">XLM</tspan></text>
  <!-- tabs -->
  <rect x="24" y="472" width="752" height="44" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="514" width="188" height="2" fill="#3b82f6"/>
  <text x="82" y="500" font-size="14" font-weight="500" fill="#2563eb">Balances</text>
  <text x="270" y="500" font-size="14" fill="#64748b">All Assets</text>
  <text x="460" y="500" font-size="14" fill="#64748b">Details</text>
  <text x="640" y="500" font-size="14" fill="#64748b">History</text>
  <!-- balances tab content -->
  <rect x="24" y="516" width="752" height="68" rx="0 0 12 12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="530" width="726" height="40" rx="8" fill="#f8fafc"/>
  <text x="56" y="550" font-size="13" font-weight="500" fill="#0f172a">Account 1</text>
  <text x="56" y="564" font-size="11" fill="#64748b" font-family="monospace">GABCDEF12…</text>
  <text x="500" y="558" font-size="16" font-weight="bold" fill="#0f172a">1,234.5678 <tspan font-size="12" fill="#64748b">XLM</tspan></text>
</svg>
