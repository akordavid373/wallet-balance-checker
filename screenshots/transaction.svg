<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="hero3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="#f8fafc" rx="8"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="800" height="40" fill="#f1f5f9"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#eab308"/>
  <circle cx="56" cy="20" r="6" fill="#22c55e"/>
  <!-- header -->
  <rect x="24" y="60" width="752" height="48" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="90" font-size="18" font-weight="bold" fill="#0f172a">Wallet Dashboard</text>
  <rect x="620" y="70" width="70" height="28" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="632" y="89" font-size="13" fill="#374151">↻ Refresh</text>
  <rect x="700" y="70" width="70" height="28" rx="6" fill="white" stroke="#fecaca" stroke-width="1"/>
  <text x="712" y="89" font-size="13" fill="#dc2626">Disconnect</text>
  <!-- success feedback -->
  <rect x="24" y="120" width="752" height="120" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="56" cy="155" r="16" fill="#22c55e"/>
  <text x="48" y="162" font-size="16" fill="white" text-anchor="middle">✓</text>
  <text x="88" y="152" font-size="15" font-weight="600" fill="#166534">Transaction Successful</text>
  <text x="88" y="175" font-size="13" fill="#15803d">Sent 25 XLM to <tspan font-family="monospace">GABCDE…WXYZ</tspan></text>
  <rect x="88" y="192" width="110" height="24" rx="4" fill="white"/>
  <text x="96" y="209" font-size="12" fill="#2563eb">↗ StellarExpert</text>
  <rect x="208" y="192" width="85" height="24" rx="4" fill="white"/>
  <text x="216" y="209" font-size="12" fill="#64748b">📋 Copy Hash</text>
  <text x="700" y="165" font-size="13" fill="#166534">Sent ↓</text>
  <text x="700" y="182" font-size="11" fill="#15803d">25 XLM</text>
  <!-- updated hero after transaction -->
  <rect x="24" y="256" width="752" height="100" rx="12" fill="url(#hero3)"/>
  <text x="40" y="280" font-size="13" fill="#bfdbfe">Account 1</text>
  <rect x="680" y="272" width="60" height="22" rx="999" fill="rgba(255,255,255,0.2)"/>
  <circle cx="690" cy="283" r="4" fill="#86efac"/>
  <text x="700" y="286" font-size="11" fill="#bfdbfe">Testnet</text>
  <text x="40" y="318" font-size="28" font-weight="bold" fill="white">1,209.5678 <tspan font-size="14" fill="#bfdbfe">XLM</tspan></text>
  <text x="40" y="340" font-size="12" fill="#bfdbfe" font-family="monospace">GABCDEF1234…WXYZ5678</text>
  <text x="620" y="318" font-size="12" fill="#fbbf24">-25 XLM sent</text>
  <!-- history tab showing the transaction -->
  <rect x="24" y="372" width="752" height="44" rx="12 12 0 0" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="82" y="400" font-size="14" fill="#64748b">Balances</text>
  <text x="270" y="400" font-size="14" fill="#64748b">All Assets</text>
  <text x="460" y="400" font-size="14" fill="#64748b">Details</text>
  <rect x="640" y="414" width="100" height="2" fill="#3b82f6"/>
  <text x="656" y="400" font-size="14" font-weight="500" fill="#2563eb">History</text>
  <!-- history content -->
  <rect x="24" y="416" width="752" height="68" rx="0 0 12 12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="430" width="726" height="40" rx="8" fill="#f8fafc"/>
  <circle cx="58" cy="450" r="14" fill="#dcfce7"/>
  <text x="52" y="456" font-size="12" fill="#16a34a" text-anchor="middle">↑</text>
  <text x="84" y="447" font-size="13" font-weight="500" fill="#0f172a">Payment</text>
  <text x="84" y="462" font-size="11" fill="#64748b" font-family="monospace">abcd1234…</text>
  <text x="200" y="462" font-size="11" fill="#64748b">· 6/29/2026</text>
  <text x="600" y="457" font-size="13" font-weight="500" fill="#0f172a">25 XLM</text>
  <rect x="680" y="444" width="20" height="20" rx="4" fill="none"/>
  <text x="684" y="459" font-size="12" fill="#94a3b8">↗</text>
</svg>
