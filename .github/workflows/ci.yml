name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none

      - name: Install wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Build contracts
        run: |
          cargo build --target wasm32v1-none --release --manifest-path contracts/wallet-registry/contracts/wallet-registry/Cargo.toml
          cargo build --target wasm32v1-none --release --manifest-path contracts/vault/contracts/vault/Cargo.toml

      - name: Test contracts
        run: |
          cargo test --manifest-path contracts/wallet-registry/contracts/wallet-registry/Cargo.toml
          cargo test --manifest-path contracts/vault/contracts/vault/Cargo.toml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [build, contracts]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
